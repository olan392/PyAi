[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "python.pyai"
version = "0.3.0"
description = "A simple Python AI library"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "olan"}
]

[tool.setuptools.packages.find]
include = ["pyai*"]
